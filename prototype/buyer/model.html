<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chi tiết sản phẩm — PCMatch</title>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/buyer.css">
</head>
<body data-buyer-app>
  <main id="main"><p role="status">Đang tải chi tiết sản phẩm…</p></main>
  <noscript>Vui lòng bật JavaScript để tìm, lọc và chọn sản phẩm trong bản demo.</noscript>
  <template data-page="model">
<nav class="catalog-breadcrumb" aria-label="Đường dẫn" data-content="breadcrumb"></nav>
<header data-content="heading"></header>
<section class="model-overview" aria-label="Chi tiết model"><figure class="product-figure" data-content="image"></figure><div class="stack" data-content="specs"></div></section>
<section id="offers" aria-labelledby="offers-title"><div class="section-heading"><h2 id="offers-title">Offer từ các shop</h2><div data-content="region"></div></div><p data-content="offer-count"></p><div class="cluster"><button type="button" class="btn btn--secondary" data-action="offers-toggle" aria-expanded="false" aria-controls="offer-comparison">So sánh shop</button></div><section id="offer-comparison" hidden aria-label="Bảng so sánh shop" data-content="offer-table"></section><div class="offer-cards" data-content="offers"></div></section>
<section id="related-products" aria-labelledby="related-title"><div class="section-heading"><h2 id="related-title">Sản phẩm khác bạn có thể quan tâm</h2><a class="btn btn--secondary" href="search.html">Xem tất cả sản phẩm</a></div><p class="muted">Ưu tiên cùng danh mục, sau đó là các linh kiện khác trong catalogue demo. Không phải gợi ý tương thích cấu hình.</p><div class="catalog-grid related-products" data-content="related"></div></section>
<section id="reviews" class="panel panel--padded" aria-labelledby="reviews-title"><h2 id="reviews-title">Đánh giá sau mua</h2><div data-content="reviews"></div></section>
<div data-content="compare-tray" class="compare-tray"></div><div data-content="report"></div>
  </template>
  <script type="module" src="../assets/js/buyer.js"></script>
</body>
</html>
